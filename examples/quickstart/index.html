<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks, the smallest app with mods</title>
<link rel="icon" href="data:,">
<style>
/* The app's own look. It keeps its colors in variables, which is all the plugin needs. */
:root {
  --bg: #fbfaf7; --panel: #ffffff; --fg: #1e1b24; --fg-quiet: #5d5866; --accent: #d9482b; --on-accent: #ffffff; --line: #d9d4cb;
  --radius: 6px; --font: system-ui, "Segoe UI", sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17151b; --panel: #201d26; --fg: #f1eef5; --fg-quiet: #b3adbd; --accent: #ff8a6b; --on-accent: #1e1b24; --line: #3a3544; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: clamp(17px, 1.1vw, 21px)/1.5 var(--font); }
.page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; min-height: 100vh; }
.page > section { display: flex; flex-direction: column; padding: clamp(20px, 4vw, 56px); }
.page > section + section { background: var(--panel); border-left: 2px solid var(--line); }
h1, h2 { margin: 0 0 .6em; font-size: 1.7em; line-height: 1.15; }
.tasks { display: flex; flex-direction: column; margin: 0 0 1em; padding: 0; list-style: none; }
.task { display: flex; gap: .7em; align-items: center; padding: .7em 0; border-bottom: 1px solid var(--line); font-size: 1.1em; }
.task input { width: 1.25em; height: 1.25em; accent-color: var(--accent); }
.task.done span { text-decoration: line-through; color: var(--fg-quiet); }
form { display: flex; gap: .6em; }
form input { flex: 1; min-width: 0; padding: .6em .8em; font: inherit; color: inherit; background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); }
button.go { padding: .6em 1.1em; font: inherit; font-weight: 700; color: var(--on-accent); background: var(--accent); border: 0; border-radius: var(--radius); cursor: pointer; }
.left { margin-top: auto; padding-top: 1.2em; color: var(--fg-quiet); }
@media (max-width: 760px) {
  .page { grid-template-columns: minmax(0, 1fr); }
  .page > section + section { border-left: 0; border-top: 2px solid var(--line); }
}
</style>
</head>
<body>
<div class="page" data-zone="page">
  <section data-piece="tasks">
    <h1>Tasks</h1>
    <ul class="tasks" id="tasks"></ul>
    <form id="add">
      <input id="what" aria-label="A new task" placeholder="A new task" autocomplete="off">
      <button class="go" type="submit">Add</button>
    </form>
    <p class="left" id="left"></p>
  </section>
  <section data-piece="settings">
    <h2>Settings</h2>
    <!-- The whole screen for mods is this tag. -->
    <moods-panel></moods-panel>
  </section>
</div>

<script type="module">
// The whole integration: two lines here and the tag above.
import { startMods } from "../../skills/moods/runtime/index.js";
window.mods = await startMods({ contract: "./contract.json" });

// The rest is the app itself.
const tasks = [
  { text: "Put mods in my app", done: true },
  { text: "Pick a mood", done: false },
  { text: "Ask my agent for rounder corners", done: false },
  { text: "Update the app and see my mods still on", done: false },
  { text: "Turn every mod off, and back on", done: false },
];
const list = document.getElementById("tasks");
const left = document.getElementById("left");
function draw() {
  list.replaceChildren(...tasks.map((task, i) => {
    const item = document.createElement("li");
    item.className = task.done ? "task done" : "task";
    item.dataset.piece = "task";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = task.done;
    box.setAttribute("aria-label", task.text);
    box.addEventListener("change", () => { tasks[i].done = box.checked; draw(); });
    const text = document.createElement("span");
    text.textContent = task.text;
    item.append(box, text);
    return item;
  }));
  const open = tasks.filter((t) => !t.done).length;
  left.textContent = open === 1 ? "1 task left." : `${open} tasks left.`;
}
document.getElementById("add").addEventListener("submit", (event) => {
  event.preventDefault();
  const input = document.getElementById("what");
  if (input.value.trim()) tasks.push({ text: input.value.trim(), done: false });
  input.value = "";
  draw();
});
draw();
window.ready = true;
</script>
</body>
</html>
